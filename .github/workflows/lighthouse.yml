name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://sliptrack:sliptrack@localhost:5432/sliptrack
          NEXTAUTH_SECRET: ci-secret-not-real
          NEXTAUTH_URL: http://localhost:3000

      - name: Start server
        run: node .next/standalone/server.js > /tmp/server.log 2>&1 &
        env:
          DATABASE_URL: postgresql://sliptrack:sliptrack@localhost:5432/sliptrack
          NEXTAUTH_SECRET: ci-secret-not-real
          AUTH_SECRET: ci-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
          AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: 1
          PORT: 3000
          HOSTNAME: 0.0.0.0

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000 || (cat /tmp/server.log && exit 1)

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
